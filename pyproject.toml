[project]
name = "takora-trading"
version = "0.1.0"
description = "Trading Platform Monorepo"
requires-python = ">=3.10"
dependencies = [
    "rust-core",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic-settings>=2.0",
    "common",
    "schemas",
    "storage",
    "messaging",
    "execution_gateway",
    "api_server",
    "risk",
    "strategies",
    "collectors",
]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
extraPaths = [
  "packages/common/src",
  "packages/schemas/src",
    "packages/storage/src",
    "packages/messaging/src",
    "packages/risk/src",
    "packages/strategies/src",
    "apps/orderbook_collector/src",
  "apps/stream_processor/src",
  "apps/execution_gateway/src",
  "apps/api_server/src",
  "apps/collectors/src",
]

[tool.uv.workspace]
members = [
    "apps/api_server",
    "apps/execution_gateway",
    "apps/orderbook_collector",
    "apps/stream_processor",
    "apps/test",
    "packages/*",
    "crates/*",
    "research/benchmarks",
    "apps/collectors",
    "research/benchmarks/transform",
    "research",
]
exclude = [
    "crates/binance_sbe"
]

[tool.uv.sources]
rust-core = { workspace = true }
common = { workspace = true }
schemas = { workspace = true }
storage = { workspace = true }
messaging = { workspace = true }
execution_gateway = { workspace = true }
api_server = { workspace = true }
risk = { workspace = true }
strategies = { workspace = true }
collectors = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "packages/common/src",
  "packages/schemas/src",
  "packages/storage/src",
  "packages/messaging/src",
  "packages/risk/src",
  "packages/strategies/src",
  "apps/orderbook_collector/src",
  "apps/stream_processor/src",
  "apps/execution_gateway/src",
  "apps/api_server/src",
  "apps/collectors/src",
]
testpaths = [
  "packages/common/tests",
  "packages/schemas/tests",
  "packages/storage/tests",
  "packages/risk/tests",
  "research/backtests/microstructure/tests",
  "apps/collectors/src/tests",
  "apps/api_server/tests",
  "apps/execution_gateway/tests",
  "tests"
]
markers = [
  "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
  "integration: marks tests that call external systems or network resources",
  "stable: 코드 수정 전까지는 신경 안 써도 되는 안정적인 테스트",
  "research: mark test as a research-related test",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.10.0",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true

# ── 내부 워크스페이스 패키지 (mypy path에 없음) ──
[[tool.mypy.overrides]]
module = [
    "common.*",
    "cryptography.*",
]
ignore_missing_imports = true
