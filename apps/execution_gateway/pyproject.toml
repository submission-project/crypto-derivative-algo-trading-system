[project]
name = "execution_gateway"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "orjson>=3.10.0",
    "common",
    "schemas",
    "storage",
    "messaging",
    "aiolimiter>=1.2.1",
    "cryptography>=42.0.0",
    "aiokafka>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
