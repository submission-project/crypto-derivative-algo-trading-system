[project]
name = "api_server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "common",
    "schemas",
    "storage",
    "execution_gateway",
    "strategies",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
strategies = { workspace = true }
